name: build-conda

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-conda:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            runner: ubuntu-latest
          - platform: osx-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify build platform
        run: |
          case "${{ matrix.platform }}:$(uname -s):$(uname -m)" in
            linux-64:Linux:x86_64|osx-arm64:Darwin:arm64) ;;
            *) echo "Runner does not match requested platform" >&2; exit 1 ;;
          esac
      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.23
        with:
          recipe-path: recipe.yaml
          artifact-name: bender-${{ matrix.platform }}

  publish-conda:
    name: Publish to Anaconda.org
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-conda
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: bender-*
          path: dist
          merge-multiple: true
      - name: Install rattler-build
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/prefix-dev/rattler-build/releases/download/v0.32.1/rattler-build-x86_64-unknown-linux-musl \
            --output "$RUNNER_TEMP/rattler-build"
          chmod +x "$RUNNER_TEMP/rattler-build"
      - name: Upload packages
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          if [[ -z "$ANACONDA_API_TOKEN" ]]; then
            echo "The ANACONDA_API_TOKEN repository secret is not configured" >&2
            exit 1
          fi
          mapfile -t packages < <(find dist -type f \( -name '*.conda' -o -name '*.tar.bz2' \))
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No conda packages were downloaded" >&2
            exit 1
          fi
          "$RUNNER_TEMP/rattler-build" upload anaconda \
            --owner KULeuven-MICAS \
            --api-key "$ANACONDA_API_TOKEN" \
            "${packages[@]}"
